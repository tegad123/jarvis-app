<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewChannelSheet · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6" style="max-width:640px"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  function Create() {
    var b = React.useState(false), busy = b[0], setBusy = b[1];
    return h(J.NewChannelSheet, { inline: true, busy: busy, onClose: function () {},
      onSubmit: function () { setBusy(true); setTimeout(function () { setBusy(false); }, 1200); } });
  }
  function L(t) { return h('p', { className: 'm-0 text-jm-caption text-jm-fg-secondary' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    L('New channel'),
    h(Create),
    L('Rename, refused by the server'),
    h(J.NewChannelSheet, { inline: true, mode: 'rename', initialValue: '128 Alder', onClose: function () {},
      error: 'A channel with that name already exists.' })
  ));
</script>
</body>
</html>
