<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignIn · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  var people = [
    { id: 'dana', name: 'Dana Reyes', title: 'Owner' },
    { id: 'marco', name: 'Marco Lin', title: 'Agent' },
    { id: 'priya', name: 'Priya Shah', title: 'Transaction coordinator (part-time, shared with another team)' }
  ];
  function Frame(label, child) {
    return h('div', { style: { display: 'grid', gap: '8px', flex: '1 1 380px', maxWidth: '440px' } },
      h('p', { className: 'm-0 text-jm-caption text-jm-fg-secondary' }, label),
      h('div', { style: { minHeight: '540px', display: 'grid', border: '1px solid var(--jm-border)', borderRadius: 'var(--jm-radius-lg)', overflow: 'hidden' } }, child));
  }
  function Live() {
    var e = React.useState(null), err = e[0], setErr = e[1];
    var b = React.useState(false), busy = b[0], setBusy = b[1];
    return h(J.SignIn, {
      people: people, defaultMode: 'pin', defaultPerson: 'dana', defaultSecret: 'k7qm-2xpa-9d4f',
      busy: busy, error: err, onModeChange: function () { setErr(null); },
      onSubmit: function () { setBusy(true); setErr(null); setTimeout(function () { setBusy(false); setErr('That PIN is not right.'); }, 900); }
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'flex flex-wrap items-start gap-jm-4' },
    Frame('Start', h(J.SignIn, { people: people })),
    Frame('PIN, someone chosen (press Continue)', h(Live)),
    Frame('Choosing who you are', h(J.SignIn, { people: people, defaultMode: 'pin', defaultPerson: null })),
    Frame('Operator access', h(J.SignIn, { people: people, defaultMode: 'operator', error: 'Too many attempts. Wait a few minutes and try again.' }))
  ));
</script>
</body>
</html>
