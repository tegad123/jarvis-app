<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmptyState · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  function Box(child) {
    return h('div', { style: { flex: '1 1 260px', border: '1px solid var(--jm-border)', borderRadius: 'var(--jm-radius-lg)' } }, child);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'flex flex-wrap items-start gap-jm-4', style: { alignItems: 'stretch' } },
    Box(h(J.EmptyState, { icon: 'activity' })),
    Box(h(J.EmptyState, { icon: 'approvals', title: 'Nothing waiting on you' }, 'When Jarvis needs a yes before something goes out, it appears here.')),
    Box(h(J.EmptyState, { icon: 'tasks', action: { label: 'Clear filters' } }, 'No tasks match those filters.'))
  ));
</script>
</body>
</html>
