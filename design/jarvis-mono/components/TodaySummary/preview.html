<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TodaySummary · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6" style="max-width:760px"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  function L(t) { return h('p', { className: 'm-0 text-jm-caption text-jm-fg-secondary' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    L('Something needs you'),
    h(J.TodaySummary, { items: ['5 emails filed', '2 tasks created', '1 done'], needsYou: 2 }),
    L('All clear'),
    h(J.TodaySummary, { items: ['3 emails filed', '1 task created'], needsYou: 0 }),
    L('Quiet morning'),
    h(J.TodaySummary, { items: [], needsYou: 0 }),
    L('The summary could not load'),
    h(J.TodaySummary, { unavailable: true })
  ));
</script>
</body>
</html>
