<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskRow · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6" style="max-width:760px"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  var people = [{ id: 'dana', name: 'Dana Reyes' }, { id: 'marco', name: 'Marco Lin' }];
  function Live() {
    var s = React.useState('open'), st = s[0], set = s[1];
    var a = React.useState('dana'), who = a[0], setWho = a[1];
    return h(J.TaskRow, {
      title: 'Send the counter to the listing agent', detail: 'Counter at $612,000, same closing date. Approval is in Approvals.',
      status: st, onStatus: set, canStatus: true, canManage: true, people: people,
      assignee: who, assigneeName: who ? people.filter(function (p) { return p.id === who; })[0].name : '', onAssign: setWho,
      priority: 'high', overdue: true, dueLabel: 'Overdue · was due Tue', openFor: '4 days open', byJarvis: true
    });
  }
  function L(t) { return h('p', { className: 'm-0 text-jm-caption text-jm-fg-secondary' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    L('Owner view: tap a status to move it along'),
    h(J.List, null,
      h(Live),
      h(J.TaskRow, { title: 'Book the final walkthrough', status: 'in_progress', canStatus: true, canManage: true, people: people,
        assignee: 'marco', assigneeName: 'Marco Lin', dueLabel: 'Due Fri', openFor: '2 days open' }),
      h(J.TaskRow, { title: 'Order the title report', status: 'done', canStatus: true, canManage: true, people: people,
        assignee: 'dana', assigneeName: 'Dana Reyes', openFor: 'Done in 1 day', byJarvis: true }),
      h(J.TaskRow, { title: 'Follow up with the appraiser', status: 'open', canStatus: true, canManage: true, people: people,
        assignee: '', assigneeName: '', stale: true, openFor: '9 days open' })),
    L('Operator access: structure only, no details, no controls'),
    h(J.List, null,
      h(J.TaskRow, { title: 'Send the counter to the listing agent', status: 'open', assigneeName: 'Dana Reyes', dueLabel: 'Overdue · was due Tue', overdue: true, openFor: '4 days open' }))
  ));
</script>
</body>
</html>
