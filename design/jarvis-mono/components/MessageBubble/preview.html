<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MessageBubble · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  var REPLY = 'The inspection is booked for Friday at 10. I sent the buyer a reminder for Thursday evening and added it to your calendar.';
  var photo = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><rect width='160' height='160' fill='#d9d9d9'/>" +
    "<path d='M0 118 52 70l34 30 22-18 52 40v38H0Z' fill='#b3b3b3'/><circle cx='118' cy='44' r='14' fill='#f2f2f2'/></svg>");

  /* Loops: typing dots, then the reply streams in chunks of one to three words. */
  function Streaming() {
    var s = React.useState({ phase: 'typing', n: 0, run: 0 }), st = s[0], set = s[1];
    var words = REPLY.split(' ');
    React.useEffect(function () {
      var t;
      if (st.phase === 'typing') t = setTimeout(function () { set({ phase: 'stream', n: 0, run: st.run }); }, 1400);
      else if (st.phase === 'stream' && st.n < words.length) t = setTimeout(function () { set({ phase: 'stream', n: Math.min(words.length, st.n + 1 + Math.floor(Math.random() * 3)), run: st.run }); }, 140);
      else if (st.phase === 'stream') t = setTimeout(function () { set({ phase: 'done', n: words.length, run: st.run }); }, 200);
      else t = setTimeout(function () { set({ phase: 'typing', n: 0, run: st.run + 1 }); }, 2600);
      return function () { clearTimeout(t); };
    }, [st]);
    return h(J.MessageBubble, {
      key: st.run,
      role: 'assistant',
      typing: st.phase === 'typing',
      streaming: st.phase === 'stream',
      text: words.slice(0, st.n).join(' '),
      speech: st.phase === 'done' ? 'off' : undefined
    });
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid max-w-jm-chat gap-jm-4' },
    h(J.MessageBubble, {
      role: 'user',
      text: 'Can you confirm the inspection for 128 Alder and remind the buyer?',
      attachments: [
        { id: 'a1', name: 'front.jpg', isImage: true, src: photo, size: '310 KB' },
        { id: 'a2', name: 'inspection-request.pdf', size: '1.2 MB', readable: false }
      ]
    }),
    h(Streaming),
    h(J.MessageBubble, {
      role: 'assistant',
      text: 'I can check your calendar once your Google account is connected.',
      actions: [{ label: 'Connect your Google account' }],
      speech: 'on'
    }),
    h(J.MessageBubble, { role: 'user', text: 'Draft the counter at 612.' }),
    h(J.MessageBubble, { role: 'assistant', text: 'Here is a draft of the counter at $612,000 with the same closing date. I kept the', partial: true, speech: 'speaking' })
  ));
</script>
</body>
</html>
