<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · Jarvis Mono</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../build/jarvis-mono.css">
<script src="../../previews/kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../build/jarvis-mono.js"></script>
</head>
<body class="bg-jm-bg font-jm text-jm-fg antialiased">
<div id="root" class="grid gap-jm-4 p-jm-6"></div>
<script>
  var J = window.JarvisMono, h = React.createElement;
  function Row(label, kids) {
    return h('div', { className: 'flex flex-wrap items-start gap-jm-4', style: { alignItems: 'center' } },
      h('p', { className: 'm-0 text-jm-caption text-jm-fg-secondary', style: { width: '72px' } }, label), kids);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    Row('Variants', [
      h(J.Button, { key: 1, variant: 'primary' }, 'Allow for 30 min'),
      h(J.Button, { key: 2 }, 'Not now'),
      h(J.Button, { key: 3, variant: 'ghost' }, 'Cancel'),
      h(J.Button, { key: 4, variant: 'primary', disabled: true }, 'Approve')
    ]),
    Row('Small, icon', [
      h(J.Button, { key: 1, size: 'sm' }, 'Enter'),
      h(J.Button, { key: 2, size: 'sm', icon: 'copy' }, 'Copy'),
      h(J.Button, { key: 3, variant: 'primary', icon: 'send', 'aria-label': 'Send' }),
      h(J.Button, { key: 4, variant: 'ghost', icon: 'mic', 'aria-label': 'Record a voice note' }),
      h(J.Button, { key: 5, variant: 'ghost', icon: 'plus', 'aria-label': 'Add a photo or file' })
    ])
  ));
</script>
</body>
</html>
