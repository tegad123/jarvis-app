# OAuth drop-in. Fernet key minted at stamp time. Mode 0600.
# Production: APP_COOKIE_SECURE=1. Scratch loopback HTTP: APP_COOKIE_SECURE=0.
[Service]
Environment=APP_PUBLIC_ORIGIN={{PUBLIC_ORIGIN}}
Environment=APP_COOKIE_SECURE={{COOKIE_SECURE}}
Environment="APP_GOOGLE_TOKEN_KEY={{FERNET_KEY}}"
Environment=YAMIN_OAUTH_CLIENT={{OAUTH_CLIENT}}
Environment=OAUTHLIB_RELAX_TOKEN_SCOPE=1
