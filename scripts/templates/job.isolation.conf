# Two-user isolation for the digest, sweep and metrics jobs: they write the
# shared state databases, so they run as the app user under its sandbox.
[Service]
User={{APP_USER}}
Group={{APP_USER}}
SupplementaryGroups={{GROUP}}
UMask=0007
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
EnvironmentFile={{ENV_FILE}}
Environment=HOME={{APP_PRIVATE}}
Environment=JARVIS_ACCOUNTS_DB={{APP_PRIVATE}}/jarvis_accounts.db
Environment=JARVIS_THREADS_DB={{APP_PRIVATE}}/jarvis_threads.db
ReadWritePaths={{APP_PRIVATE}} {{HERMES_HOME}}/state {{HERMES_HOME}}/outbox {{JARVIS_APP}}/data {{DATA_DIRS}}
