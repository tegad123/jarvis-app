# Two-user isolation for the digest, sweep and metrics jobs: they write the
# shared state databases, so they run as the app user under its sandbox.
[Service]
User={{APP_USER}}
Group={{APP_USER}}
SupplementaryGroups={{GROUP}}
UMask=0007
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
EnvironmentFile={{ENV_FILE}}
Environment=HOME={{APP_PRIVATE}}
Environment=JARVIS_ACCOUNTS_DB={{APP_PRIVATE}}/jarvis_accounts.db
Environment=JARVIS_THREADS_DB={{APP_PRIVATE}}/jarvis_threads.db
# google_creds finds the app's Google connection through this; unset, it
# reports not_connected even with a mailbox connected.
Environment=JARVIS_APP_ROOT={{JARVIS_APP}}
Environment=JARVIS_SENTINEL_MODE={{SENTINEL_MODE}}
Environment=JARVIS_PG_DSN={{PG_DSN}}
Environment=JARVIS_SWITCH_BROKER={{SWITCH_BROKER}}
Environment=JARVIS_SWITCH_SENTINEL={{SWITCH_SENTINEL}}
Environment=JARVIS_SWITCH_MODEL_PROXY={{SWITCH_MODEL_PROXY}}
Environment=JARVIS_AGENT_MODEL={{AGENT_MODEL}}
Environment=JARVIS_BACKGROUND_MODEL={{BACKGROUND_MODEL}}
ReadWritePaths={{APP_PRIVATE}} {{HERMES_HOME}}/state {{HERMES_HOME}}/outbox {{JARVIS_APP}}/data {{DATA_DIRS}}
