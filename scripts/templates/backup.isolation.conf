# Runs as root: it must read the agent-only hermes databases too.
# Code comes from the tenant tree, which neither tenant user can write.
[Service]
Environment=JARVIS_ACCOUNTS_DB={{APP_PRIVATE}}/jarvis_accounts.db
Environment=JARVIS_THREADS_DB={{APP_PRIVATE}}/jarvis_threads.db
# Set = also pg_dump jarvis_{{SLUG}} and prove the dump restores.
Environment=JARVIS_PG_DSN={{PG_DSN}}
