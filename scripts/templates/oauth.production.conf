# Production HTTPS drop-in. Cookie Secure=1. No mock, no sheet fixture.
# Connect Google signed in as the assistant account (see ONBOARDING-MAILBOX.md).
[Service]
Environment=APP_PUBLIC_ORIGIN={{PUBLIC_ORIGIN}}
Environment=APP_COOKIE_SECURE=1
Environment="APP_GOOGLE_TOKEN_KEY={{FERNET_KEY}}"
Environment=YAMIN_OAUTH_CLIENT={{OAUTH_CLIENT}}
Environment=OAUTHLIB_RELAX_TOKEN_SCOPE=1
