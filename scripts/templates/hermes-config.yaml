# Tenant-neutral Hermes config. Port is the manifest gateway port.
# No API keys. No live platform tokens.
database:
  journal_mode: wal
platforms:
  api_server:
    host: 127.0.0.1
    port: {{GATEWAY_PORT}}
curator:
  enabled: false
# Claude through the tenant app's model proxy: the app holds the real key and
# Hermes sends its own API_SERVER_KEY (hermes/.env ANTHROPIC_API_KEY) as a
# stand-in. The path must end in /anthropic or Hermes ignores base_url.
model:
  provider: anthropic
  default: {{AGENT_MODEL}}
  base_url: http://127.0.0.1:{{APP_PORT}}/api/model/anthropic
# The tenant agent's whole toolset is the Jarvis plugin (HERMES_HOME/plugins/
# jarvis, installed root-owned from the app tree): no terminal, files, web,
# code or delegation. The app's model proxy strips anything else regardless.
plugins:
  enabled:
    - jarvis
platform_toolsets:
  api_server:
    - jarvis
tools:
  tool_search:
    enabled: off
