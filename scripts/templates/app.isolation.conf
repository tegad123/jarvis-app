# Two-user isolation. Secrets come from the EnvironmentFile, which
# `systemctl show` does not expose. Code is read-only to this user.
[Service]
User={{APP_USER}}
Group={{APP_USER}}
SupplementaryGroups={{GROUP}}
UMask=0007
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
EnvironmentFile={{ENV_FILE}}
Environment=HOME={{APP_PRIVATE}}
Environment=JARVIS_ACCOUNTS_DB={{APP_PRIVATE}}/jarvis_accounts.db
Environment=JARVIS_TRANSCRIBE_SPOOL={{JARVIS_APP}}/data/tmp-transcribe
ReadWritePaths={{APP_PRIVATE}} {{HERMES_HOME}}/state {{HERMES_HOME}}/outbox {{JARVIS_APP}}/data {{DATA_DIRS}}
