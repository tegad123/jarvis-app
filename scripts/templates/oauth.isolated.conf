# OAuth drop-in for a two-user tenant. No secrets here: APP_GOOGLE_TOKEN_KEY
# is in the root-only EnvironmentFile. The client file is app-only.
[Service]
Environment=APP_PUBLIC_ORIGIN={{PUBLIC_ORIGIN}}
Environment=APP_COOKIE_SECURE={{COOKIE_SECURE}}
Environment=YAMIN_OAUTH_CLIENT={{APP_PRIVATE}}/oauth_client.json
Environment=OAUTHLIB_RELAX_TOKEN_SCOPE=1
