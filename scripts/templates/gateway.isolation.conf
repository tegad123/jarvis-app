# Two-user isolation. The agent cannot read the app's accounts or threads
# databases; naming their paths makes a direct read fail loudly instead of
# creating an empty database in the shared state directory. Google calls,
# counters and channel creation go through the app's loopback broker. Hermes chmods its home on every
# start; 0710 lets the app traverse to state/ without listing the home.
[Service]
User={{AGENT_USER}}
Group={{AGENT_USER}}
SupplementaryGroups={{GROUP}}
UMask=0007
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
Environment=HOME={{HERMES_HOME}}
Environment=HERMES_HOME_MODE=0710
Environment=JARVIS_ACCOUNTS_DB={{APP_PRIVATE}}/jarvis_accounts.db
Environment=JARVIS_THREADS_DB={{APP_PRIVATE}}/jarvis_threads.db
Environment=JARVIS_APP_BROKER_URL=http://127.0.0.1:{{APP_PORT}}
ReadWritePaths={{HERMES_HOME}} {{DATA_DIRS}}
