# Two-user isolation. The agent cannot read the app's accounts database;
# naming its path makes that read fail loudly instead of creating an empty
# database in the shared state directory. Hermes chmods its home on every
# start; 0710 lets the app traverse to state/ without listing the home.
[Service]
User={{AGENT_USER}}
Group={{AGENT_USER}}
SupplementaryGroups={{GROUP}}
UMask=0007
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
Environment=HOME={{HERMES_HOME}}
Environment=HERMES_HOME_MODE=0710
Environment=JARVIS_ACCOUNTS_DB={{APP_PRIVATE}}/jarvis_accounts.db
ReadWritePaths={{HERMES_HOME}} {{DATA_DIRS}}
