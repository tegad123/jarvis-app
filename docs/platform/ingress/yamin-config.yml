# Named Cloudflare tunnel for yamin.io — replaces the three quick tunnels for
# the tenants routed here. Installed to /etc/cloudflared/config.yml by apply.sh.
#
# HOSTNAME SCHEME
#   app.yamin.io           the app UI/API of the tenant at the bare hostnames (unassigned; testco retired)
#   gateway.yamin.io       that tenant's Hermes gateway API
#   hooks.yamin.io         Gmail Pub/Sub push webhook (one listener per tenant, own port)
#   {slug}.app.yamin.io    a further tenant's app       → its own app port
#   {slug}.gateway.yamin.io                              → its own gateway port
#   {slug}.hooks.yamin.io                                → its own webhook port
# Add a tenant = three ingress rules + `cloudflared tunnel route dns yamin <host>` each.
# The live tenant (34dev) keeps its quick tunnels until it is moved by decision.
tunnel: yamin
credentials-file: /etc/cloudflared/yamin.json
ingress:
  # app/gateway/hooks.yamin.io (testco) removed 2026-10-13: testco retired,
  # see docs/platform/decisions.md. Those hostnames now hit the 404 catch-all.
  - hostname: rehearsal.yamin.io
    service: http://127.0.0.1:8730        # rehearsal app
  - hostname: rehearsal-gw.yamin.io
    service: http://127.0.0.1:8672        # rehearsal gateway
  - hostname: rehearsal-hooks.yamin.io
    service: http://127.0.0.1:18793       # rehearsal Gmail webhook listener (when enabled)
  # Part A (human yes 2026-10-16): each person's app only. Gateways stay
  # loopback-only; a hooks hostname is added in Part C if Gmail push is wanted.
  # Every hostname here sits behind a Cloudflare Access application.
  - hostname: eddie.yamin.io
    service: http://127.0.0.1:8750        # eddie app
  - hostname: blake.yamin.io
    service: http://127.0.0.1:8760        # blake app
  - hostname: martin.yamin.io
    service: http://127.0.0.1:8770        # martin app
  - hostname: tega.yamin.io
    service: http://127.0.0.1:8780        # tega app
  - service: http_status:404
