# Onboarding dress rehearsal — production posture on a public origin.
# APP_COOKIE_SECURE=1 (production oauth template). Writes-guard ON (blocked).
# Addresses are the rehearsal Gmail mailbox; no RFC 2606 capture suffix.
# writes_posture blocked (schema: blocked | captured | live). Production oauth + preflight inversion.

slug: rehearsal
display_name: Rehearsal Brokerage
business_description: a dress-rehearsal brokerage used to prove production onboarding
timezone: America/Chicago

assistant_address: notevaultai@gmail.com
agent_display_name: Test
mailbox_strategy: dedicated_account

ports:
  app: 8730
  gateway: 8672
  hooks: 18793

public_origin: https://rehearsal.yamin.io

sheet_id: ""

boundary_domains:
  - gmail.com
outbound_suffix_policy: production

skill_loadout: base
skill_loadout_optional: []

skills_origin_sha: 8436f6ee1ab3c096c062dff6c3cf197b657dc549
curator_packs: omit

writes_posture: blocked
venv: platform
isolation: two_user

backup:
  destination: /root/backups/rehearsal
  keep_daily: 14


digest:
  times_local: ["05:00", "15:00"]
  default_assignee: ""

sweeps:
  stale_email_hours: 24
  email_grace_days: 2
  task_quiet_hours: 24
  task_escalate_after: 3
  lead_quiet_days: 3
  hot_lead_quiet_days: 1
  lead_nudge_backoff_days: 3
  min_interval_minutes: 30

schedule:
  digest_tick_seconds: 300
  sweep_tick_seconds: 1800
  metrics_calendar: "*-*-* 08:30:00"
  digest_on_boot_sec: 120
  sweep_on_boot_sec: [180, 240, 300]
  digest_accuracy_sec: 30
  sweep_accuracy_sec: 60
  metrics_accuracy: 5m

email_router:
  lookback_days: 7
  recording_subject_prefix: "PLAUD:"
  deal_channel_prefix: "deals-"
email_monitor:
  lookback_days: 14
gmail_push_trigger:
  webhook_port: 18793
  mailbox: ""
  gcp_project: ""
  pubsub_topic: ""
  pubsub_subscription: ""
  tunnel_hostname: ""
cost_guard:
  spend_warn_usd: 5
  spend_pause_usd: 10
leads:
  source: store
  export_enabled: false
  export_sheet_id: ""
tasks:
  source: store
lead_reply:
  sheet_id: ""
  exclude_tabs: ["SEND LOG", "OLD LEADS"]
google_calendar:
  default_calendar_id: ""
email_to_calendar:
  calendar_id: ""
  always_attendee: ""
meeting_briefing:
  owner_person: ""
owner_email_voice:
  voice_corpus_path: ""
feed:
  team_destinations: ["ops", "deals"]
safety:
  outbound_recipient_suffix: []
  allow_writes: false
gateway:
  base_url: http://127.0.0.1:8672
paths:
  app_root: /opt/rehearsal/jarvis-app

