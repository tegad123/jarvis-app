<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jarvis</title>
    <meta name="description" content="Jarvis — activity, approvals and leads for your business." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <!-- theme-color is swapped at runtime by theme.ts to match the active mode -->
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Applied pre-paint so the first frame is already in the right mode.
      // Mirrors initialTheme() in src/lib/theme.ts — keep the two in step.
      (function () {
        try {
          var stored = localStorage.getItem('jarvis-mono-theme');
          document.documentElement.classList.add(stored === 'light' ? 'light' : 'dark');
        } catch (e) {
          /* private mode / storage disabled — the default dark */
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
